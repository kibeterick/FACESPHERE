<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Management - AKIRA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #667eea; font-size: 2.5em; }
        .back-btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
        }
        .back-btn:hover { background: #5568d3; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card .icon { font-size: 2.5em; margin-bottom: 10px; }
        .stat-card .value { font-size: 2em; font-weight: bold; color: #667eea; }
        .stat-card .label { color: #666; margin-top: 5px; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        .form-group textarea { min-height: 150px; resize: vertical; }
        
        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }
        .btn:hover { background: #5568d3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        
        .email-list {
            max-height: 500px;
            overflow-y: auto;
        }
        .email-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .email-item:hover { background: #e9ecef; transform: translateX(5px); }
        .email-item.unread { border-left: 4px solid #667eea; font-weight: bold; }
        .email-item .from { color: #333; font-weight: 500; margin-bottom: 5px; }
        .email-item .subject { color: #667eea; margin-bottom: 5px; }
        .email-item .preview { color: #666; font-size: 0.9em; }
        .email-item .time { color: #999; font-size: 0.85em; margin-top: 5px; }
        
        .template-list {
            display: grid;
            gap: 10px;
        }
        .template-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .template-item:hover { background: #e9ecef; }
        .template-item .name { font-weight: bold; color: #667eea; margin-bottom: 5px; }
        .template-item .desc { color: #666; font-size: 0.9em; }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #f8f9fa;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
        }
        .tab.active { background: #667eea; color: white; }
        
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Management</h1>
            <a href="/" class="back-btn">← Back to Home</a>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📥</div>
                <div class="value" id="totalInbox">0</div>
                <div class="label">Inbox</div>
            </div>
            <div class="stat-card">
                <div class="icon">✉️</div>
                <div class="value" id="unreadCount">0</div>
                <div class="label">Unread</div>
            </div>
            <div class="stat-card">
                <div class="icon">📤</div>
                <div class="value" id="totalSent">0</div>
                <div class="label">Sent</div>
            </div>
            <div class="stat-card">
                <div class="icon">📝</div>
                <div class="value" id="totalDrafts">0</div>
                <div class="label">Drafts</div>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="section">
                <h2>✍️ Compose Email</h2>
                <div id="emailMessage" class="message"></div>
                
                <div class="tabs">
                    <button class="tab active" onclick="showComposeTab('compose')">Compose</button>
                    <button class="tab" onclick="showComposeTab('templates')">Templates</button>
                </div>
                
                <div id="composeTab">
                    <form id="emailForm">
                        <div class="form-group">
                            <label>To *</label>
                            <input type="email" id="emailTo" required placeholder="[email]">
                        </div>
                        <div class="form-group">
                            <label>Subject *</label>
                            <input type="text" id="emailSubject" required>
                        </div>
                        <div class="form-group">
                            <label>Message *</label>
                            <textarea id="emailBody" required></textarea>
                        </div>
                        <button type="submit" class="btn">Send Email</button>
                        <button type="button" class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
                    </form>
                </div>
                
                <div id="templatesTab" style="display: none;">
                    <div class="template-list" id="templateList"></div>
                </div>
            </div>
            
            <div class="section">
                <h2>📬 Inbox</h2>
                <div class="email-list" id="emailList"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Load statistics
        async function loadStatistics() {
            try {
                const response = await fetch('/api/email/statistics');
                const stats = await response.json();
                
                document.getElementById('totalInbox').textContent = stats.inbox.total;
                document.getElementById('unreadCount').textContent = stats.inbox.unread;
                document.getElementById('totalSent').textContent = stats.sent;
                document.getElementById('totalDrafts').textContent = stats.drafts;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }
        
        // Load inbox
        async function loadInbox() {
            try {
                const response = await fetch('/api/email/inbox');
                const data = await response.json();
                
                const emailList = document.getElementById('emailList');
                
                if (data.emails.length === 0) {
                    emailList.innerHTML = '<p style="text-align: center; color: #666;">No emails in inbox</p>';
                    return;
                }
                
                emailList.innerHTML = data.emails.map(email => `
                    <div class="email-item ${!email.read ? 'unread' : ''}" onclick="viewEmail(${email.id})">
                        <div class="from">From: ${email.from}</div>
                        <div class="subject">${email.subject}</div>
                        <div class="preview">${email.body.substring(0, 100)}...</div>
                        <div class="time">${new Date(email.timestamp).toLocaleString()}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading inbox:', error);
            }
        }
        
        // Load templates
        async function loadTemplates() {
            try {
                const response = await fetch('/api/email/templates');
                const data = await response.json();
                
                const templateList = document.getElementById('templateList');
                
                const templates = [
                    { name: 'Welcome', desc: 'Welcome new users', key: 'welcome' },
                    { name: 'Notification', desc: 'General notifications', key: 'notification' },
                    { name: 'Reminder', desc: 'Send reminders', key: 'reminder' },
                    { name: 'Alert', desc: 'Alert notifications', key: 'alert' },
                    { name: 'Report', desc: 'Daily reports', key: 'report' }
                ];
                
                templateList.innerHTML = templates.map(template => `
                    <div class="template-item" onclick="useTemplate('${template.key}')">
                        <div class="name">${template.name}</div>
                        <div class="desc">${template.desc}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading templates:', error);
            }
        }
        
        // Show compose tab
        function showComposeTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'compose') {
                document.getElementById('composeTab').style.display = 'block';
                document.getElementById('templatesTab').style.display = 'none';
            } else {
                document.getElementById('composeTab').style.display = 'none';
                document.getElementById('templatesTab').style.display = 'block';
                loadTemplates();
            }
        }
        
        // Use template
        function useTemplate(templateKey) {
            const templates = {
                welcome: {
                    subject: 'Welcome to AKIRA AI System',
                    body: 'Hello,\n\nWelcome to AKIRA AI System! We\'re excited to have you on board.\n\nBest regards,\nAKIRA Team'
                },
                notification: {
                    subject: 'AKIRA Notification',
                    body: 'Hello,\n\n[Your notification message here]\n\nThis is an automated notification from AKIRA AI System.'
                },
                reminder: {
                    subject: 'Reminder',
                    body: 'Hello,\n\nThis is a reminder about: [Event/Task]\n\nBest regards,\nAKIRA AI System'
                },
                alert: {
                    subject: '🚨 Alert',
                    body: 'ALERT NOTIFICATION\n\nType: [Alert Type]\nDetails: [Alert Details]\n\nAKIRA AI System'
                },
                report: {
                    subject: 'Daily Report',
                    body: 'Daily Report\n\nSummary:\n[Summary here]\n\nGenerated by AKIRA AI System'
                }
            };
            
            const template = templates[templateKey];
            if (template) {
                document.getElementById('emailSubject').value = template.subject;
                document.getElementById('emailBody').value = template.body;
                showComposeTab('compose');
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.querySelectorAll('.tab')[1].classList.remove('active');
            }
        }
        
        // Send email
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                to_email: document.getElementById('emailTo').value,
                subject: document.getElementById('emailSubject').value,
                body: document.getElementById('emailBody').value
            };
            
            try {
                const response = await fetch('/api/email/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                const message = document.getElementById('emailMessage');
                if (result.success) {
                    message.textContent = '✅ Email sent successfully!';
                    message.className = 'message success';
                    document.getElementById('emailForm').reset();
                    loadStatistics();
                } else {
                    message.textContent = '❌ Error sending email';
                    message.className = 'message error';
                }
                message.style.display = 'block';
                
                setTimeout(() => { message.style.display = 'none'; }, 3000);
            } catch (error) {
                const message = document.getElementById('emailMessage');
                message.textContent = '❌ Error sending email';
                message.className = 'message error';
                message.style.display = 'block';
            }
        });
        
        // Save draft
        async function saveDraft() {
            const data = {
                to_email: document.getElementById('emailTo').value,
                subject: document.getElementById('emailSubject').value,
                body: document.getElementById('emailBody').value
            };
            
            try {
                const response = await fetch('/api/email/drafts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                const message = document.getElementById('emailMessage');
                message.textContent = '✅ Draft saved!';
                message.className = 'message success';
                message.style.display = 'block';
                
                loadStatistics();
                
                setTimeout(() => { message.style.display = 'none'; }, 3000);
            } catch (error) {
                console.error('Error saving draft:', error);
            }
        }
        
        // View email
        function viewEmail(emailId) {
            alert(`Email viewer would open here for email ID: ${emailId}`);
        }
        
        // Load data on page load
        loadStatistics();
        loadInbox();
        
        // Refresh every 30 seconds
        setInterval(() => {
            loadStatistics();
            loadInbox();
        }, 30000);
    </script>
</body>
</html>
