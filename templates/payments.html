<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - AKIRA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #667eea; font-size: 2.5em; }
        .back-btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
        }
        .back-btn:hover { background: #5568d3; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card .icon { font-size: 2.5em; margin-bottom: 10px; }
        .stat-card .value { font-size: 2em; font-weight: bold; color: #667eea; }
        .stat-card .label { color: #666; margin-top: 5px; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        
        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }
        .btn:hover { background: #5568d3; }
        
        .transaction-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #10b981;
        }
        .transaction-item .amount { font-weight: bold; color: #10b981; font-size: 1.2em; }
        .transaction-item .details { color: #666; font-size: 0.9em; margin-top: 5px; }
        
        .invoice-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        .invoice-item .invoice-id { font-weight: bold; color: #667eea; }
        .invoice-item .status { 
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-left: 10px;
        }
        .invoice-item .status.pending { background: #fef3c7; color: #92400e; }
        .invoice-item .status.paid { background: #d1fae5; color: #065f46; }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Payment Processing</h1>
            <a href="/" class="back-btn">← Back to Home</a>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">💰</div>
                <div class="value" id="totalRevenue">$0</div>
                <div class="label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="value" id="totalTransactions">0</div>
                <div class="label">Transactions</div>
            </div>
            <div class="stat-card">
                <div class="icon">📄</div>
                <div class="value" id="totalInvoices">0</div>
                <div class="label">Invoices</div>
            </div>
            <div class="stat-card">
                <div class="icon">⏳</div>
                <div class="value" id="pendingInvoices">0</div>
                <div class="label">Pending</div>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="section">
                <h2>💳 Process Payment</h2>
                <div id="paymentMessage" class="message"></div>
                <form id="paymentForm">
                    <div class="form-group">
                        <label>Customer ID *</label>
                        <input type="text" id="customerId" required placeholder="cust123">
                    </div>
                    <div class="form-group">
                        <label>Amount *</label>
                        <input type="number" id="amount" step="0.01" required placeholder="99.99">
                    </div>
                    <div class="form-group">
                        <label>Currency</label>
                        <select id="currency">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="paymentMethod">
                            <option value="card">Credit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="bank">Bank Transfer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="description" placeholder="Product purchase">
                    </div>
                    <button type="submit" class="btn">Process Payment</button>
                </form>
            </div>
            
            <div class="section">
                <h2>📄 Create Invoice</h2>
                <div id="invoiceMessage" class="message"></div>
                <form id="invoiceForm">
                    <div class="form-group">
                        <label>Customer ID *</label>
                        <input type="text" id="invoiceCustomerId" required placeholder="cust123">
                    </div>
                    <div class="form-group">
                        <label>Item Name *</label>
                        <input type="text" id="itemName" required placeholder="Product A">
                    </div>
                    <div class="form-group">
                        <label>Quantity *</label>
                        <input type="number" id="itemQuantity" required value="1">
                    </div>
                    <div class="form-group">
                        <label>Price *</label>
                        <input type="number" id="itemPrice" step="0.01" required placeholder="50.00">
                    </div>
                    <div class="form-group">
                        <label>Due Date</label>
                        <input type="date" id="dueDate">
                    </div>
                    <button type="submit" class="btn">Create Invoice</button>
                </form>
            </div>
        </div>
        
        <div class="section" style="margin-top: 20px;">
            <h2>📊 Recent Transactions</h2>
            <div id="transactionsList"></div>
        </div>
        
        <div class="section" style="margin-top: 20px;">
            <h2>📄 Invoices</h2>
            <div id="invoicesList"></div>
        </div>
    </div>
    
    <script>
        async function loadStatistics() {
            try {
                const response = await fetch('/api/payment/statistics');
                const stats = await response.json();
                
                document.getElementById('totalRevenue').textContent = `$${stats.total_revenue}`;
                document.getElementById('totalTransactions').textContent = stats.total_transactions;
                document.getElementById('totalInvoices').textContent = stats.total_invoices;
                document.getElementById('pendingInvoices').textContent = stats.pending_invoices;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }
        
        async function loadTransactions() {
            try {
                const response = await fetch('/api/payment/transactions?limit=10');
                const data = await response.json();
                
                const listDiv = document.getElementById('transactionsList');
                
                if (data.transactions.length === 0) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #666;">No transactions yet</p>';
                    return;
                }
                
                listDiv.innerHTML = data.transactions.map(txn => `
                    <div class="transaction-item">
                        <div class="amount">$${txn.amount} ${txn.currency}</div>
                        <div class="details">
                            ID: ${txn.transaction_id} | 
                            ${txn.payment_method} | 
                            ${new Date(txn.created_at).toLocaleString()}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading transactions:', error);
            }
        }
        
        async function loadInvoices() {
            try {
                const response = await fetch('/api/payment/invoices');
                const data = await response.json();
                
                const listDiv = document.getElementById('invoicesList');
                
                if (data.invoices.length === 0) {
                    listDiv.innerHTML = '<p style="text-align: center; color: #666;">No invoices yet</p>';
                    return;
                }
                
                listDiv.innerHTML = data.invoices.map(inv => `
                    <div class="invoice-item">
                        <div>
                            <span class="invoice-id">${inv.invoice_id}</span>
                            <span class="status ${inv.status}">${inv.status.toUpperCase()}</span>
                        </div>
                        <div class="details" style="margin-top: 5px;">
                            Total: $${inv.total} | 
                            Customer: ${inv.customer_id} | 
                            ${new Date(inv.created_at).toLocaleString()}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading invoices:', error);
            }
        }
        
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                customer_id: document.getElementById('customerId').value,
                amount: document.getElementById('amount').value,
                currency: document.getElementById('currency').value,
                payment_method: document.getElementById('paymentMethod').value,
                description: document.getElementById('description').value
            };
            
            try {
                const response = await fetch('/api/payment/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                const message = document.getElementById('paymentMessage');
                message.textContent = `✅ Payment processed! Transaction ID: ${result.transaction_id}`;
                message.className = 'message success';
                message.style.display = 'block';
                
                document.getElementById('paymentForm').reset();
                loadStatistics();
                loadTransactions();
                
                setTimeout(() => { message.style.display = 'none'; }, 3000);
            } catch (error) {
                console.error('Error processing payment:', error);
            }
        });
        
        document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                customer_id: document.getElementById('invoiceCustomerId').value,
                items: [{
                    name: document.getElementById('itemName').value,
                    quantity: parseInt(document.getElementById('itemQuantity').value),
                    price: parseFloat(document.getElementById('itemPrice').value)
                }],
                due_date: document.getElementById('dueDate').value || null
            };
            
            try {
                const response = await fetch('/api/payment/invoice/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                const message = document.getElementById('invoiceMessage');
                message.textContent = `✅ Invoice created! ID: ${result.invoice_id}`;
                message.className = 'message success';
                message.style.display = 'block';
                
                document.getElementById('invoiceForm').reset();
                loadStatistics();
                loadInvoices();
                
                setTimeout(() => { message.style.display = 'none'; }, 3000);
            } catch (error) {
                console.error('Error creating invoice:', error);
            }
        });
        
        loadStatistics();
        loadTransactions();
        loadInvoices();
        
        setInterval(() => {
            loadStatistics();
            loadTransactions();
            loadInvoices();
        }, 30000);
    </script>
</body>
</html>
