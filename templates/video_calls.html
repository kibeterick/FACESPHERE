<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Calls - AKIRA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #667eea; font-size: 2.5em; }
        .back-btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
        }
        .back-btn:hover { background: #5568d3; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card .icon { font-size: 2.5em; margin-bottom: 10px; }
        .stat-card .value { font-size: 2em; font-weight: bold; color: #667eea; }
        .stat-card .label { color: #666; margin-top: 5px; }
        
        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }
        
        .btn {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }
        .btn:hover { background: #5568d3; }
        
        .call-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        .call-item .title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .call-item .details { color: #666; font-size: 0.9em; }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        
        .video-container {
            background: #000;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: white;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .video-container .icon { font-size: 5em; margin-bottom: 20px; }
        .video-container .text { font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📹 Video Calls</h1>
            <a href="/" class="back-btn">← Back to Home</a>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">🎥</div>
                <div class="value" id="activeCalls">0</div>
                <div class="label">Active Calls</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <div class="value" id="totalCalls">0</div>
                <div class="label">Total Calls</div>
            </div>
            <div class="stat-card">
                <div class="icon">🎬</div>
                <div class="value" id="totalRecordings">0</div>
                <div class="label">Recordings</div>
            </div>
            <div class="stat-card">
                <div class="icon">⏱️</div>
                <div class="value" id="avgDuration">0</div>
                <div class="label">Avg Duration (min)</div>
            </div>
        </div>
        
        <div class="section">
            <h2>🎥 Video Call Room</h2>
            <div class="video-container">
                <div class="icon">📹</div>
                <div class="text">Video calling feature ready!</div>
                <div class="text" style="font-size: 0.9em; margin-top: 10px;">
                    Create a call below to start video conferencing
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>➕ Create Video Call</h2>
            <div id="callMessage" class="message"></div>
            <form id="callForm">
                <div class="form-group">
                    <label>Meeting Title *</label>
                    <input type="text" id="callTitle" required placeholder="Team Meeting">
                </div>
                <div class="form-group">
                    <label>Participants (comma-separated emails)</label>
                    <input type="text" id="callParticipants" placeholder="[email], [email]">
                </div>
                <div class="form-group">
                    <label>Schedule Time (optional)</label>
                    <input type="datetime-local" id="callSchedule">
                </div>
                <button type="submit" class="btn">Create Call</button>
            </form>
        </div>
        
        <div class="section">
            <h2>📋 Call History</h2>
            <div id="callHistory"></div>
        </div>
    </div>
    
    <script>
        async function loadStatistics() {
            try {
                const response = await fetch('/api/video/statistics');
                const stats = await response.json();
                
                document.getElementById('activeCalls').textContent = stats.active_calls;
                document.getElementById('totalCalls').textContent = stats.total_calls;
                document.getElementById('totalRecordings').textContent = stats.total_recordings;
                document.getElementById('avgDuration').textContent = stats.average_duration_minutes;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }
        
        async function loadCallHistory() {
            try {
                const response = await fetch('/api/video/history');
                const data = await response.json();
                
                const historyDiv = document.getElementById('callHistory');
                
                if (data.history.length === 0) {
                    historyDiv.innerHTML = '<p style="text-align: center; color: #666;">No call history yet</p>';
                    return;
                }
                
                historyDiv.innerHTML = data.history.map(call => `
                    <div class="call-item">
                        <div class="title">Call ID: ${call.call_id}</div>
                        <div class="details">
                            Duration: ${call.duration_minutes} minutes | 
                            Participants: ${call.participants_count} | 
                            ${new Date(call.started_at).toLocaleString()}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading call history:', error);
            }
        }
        
        document.getElementById('callForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const participants = document.getElementById('callParticipants').value
                .split(',').map(p => p.trim()).filter(p => p);
            
            const data = {
                host_id: 'user123',
                title: document.getElementById('callTitle').value,
                participants: participants,
                scheduled_time: document.getElementById('callSchedule').value || null
            };
            
            try {
                const response = await fetch('/api/video/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                const message = document.getElementById('callMessage');
                message.textContent = `✅ Call created! Room URL: ${result.room_url}`;
                message.className = 'message success';
                message.style.display = 'block';
                
                document.getElementById('callForm').reset();
                loadStatistics();
                loadCallHistory();
                
                setTimeout(() => { message.style.display = 'none'; }, 5000);
            } catch (error) {
                console.error('Error creating call:', error);
            }
        });
        
        loadStatistics();
        loadCallHistory();
        
        setInterval(() => {
            loadStatistics();
            loadCallHistory();
        }, 30000);
    </script>
</body>
</html>
